name: pomodocus
description: "Pomodocus — Focus. Work. Repeat. Focus on what matters."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  lottie: ^3.8.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  shorebird_code_push: ^2.0.7
  timezone: ^0.11.2
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/sounds/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "branding/icons/app-icon-1024.png"
  adaptive_icon_background: "#FBF7F3"
  adaptive_icon_foreground: "branding/icons/app-icon-foreground-1024.png"
  adaptive_icon_monochrome: "branding/icons/app-icon-monochrome-1024.png"

flutter_native_splash:
  color: "#FBF7F3"
  color_dark: "#15171C"
  image: "branding/icons/splash-1024.png"
  android_12:
    color: "#FBF7F3"
    color_dark: "#15171C"
    image: "branding/icons/splash-android12-1024.png"
  ios: true
  android: true
  web: false
